# =====================================================================
#  PANNEAU DE COMMANDE — SLEEPY MIMO
#  Modifie ce fichier sur GitHub (icône crayon ✏️ puis « Commit changes »).
#  L'équipe lit tes consignes à chaque production.
#  Règle d'écriture : garde les espaces au début des lignes et le « : » après chaque mot.
# =====================================================================

# Mettre l'équipe en pause (oui = rien n'est produit cette nuit)
pause: non

# Envoyer les vidéos sur YouTube (en privé) ? non = vidéos seulement téléchargeables dans GitHub
envoyer_sur_youtube: oui

# Publication automatique : non = tout reste en PRIVÉ et c'est toi qui publies (recommandé tant que tu veux tout vérifier).
# oui = YouTube passe tout seul les vidéos en PUBLIC à l'heure choisie (l'épisode à cette heure, les 3 Shorts ensuite).
publication_automatique: non
# Heure de l'épisode (heure de Paris, de 0 à 23). Les Shorts sortent 2 h, 4 h et 6 h après.
heure_publication: 17

# ---------- Vidéo longue ----------
duree_video_longue_minutes: 60
# Changer de décor (et d'instrument) toutes les X minutes dans la vidéo longue
changer_de_decor_toutes_les_minutes: 15
# Sons d'ambiance doux sous la musique (pluie, vagues, vent, bruit blanc) : oui / non
sons_ambiance: oui
# Comptines chantées par la voix de Mimo, avec les paroles en karaoké à l'écran : oui / non
voix_chantee: oui
# Intro « Sleepy Mimo » de 5 secondes au début de la vidéo longue : oui / non
intro_sleepy_mimo: oui
# Une petite histoire animée avec les personnages qui parlent (en anglais), au début de la vidéo longue : oui / non
histoire: oui
# Décor imposé pour la vidéo longue (laisser vide pour que le Stratège choisisse)
# Choix : lune, nuages, ocean, neige, lucioles, pluie
decor_video_longue:

# ---------- Shorts ----------
nombre_shorts: 3            # de 0 à 5
duree_shorts_secondes: 45   # de 15 à 170

# Vidéos TIKTOK, en français, séparées de YouTube (autres histoires, autre langue) : séries « Les Fables de la Forêt » (histoires en 2 parties)
# et « Le saviez-vous ? » (vrais faits sur les animaux). Chaque vidéo dure de 62 à 90 secondes (TikTok ne rémunère que les vidéos d'au moins 1 minute).
# Elles ne partent PAS sur YouTube : workflow à part (« Sleepy Mimo - TikTok en français », chaque matin), vidéos + légendes (tiktok.md) dans l'artefact « tiktok-du-jour ».
nombre_tiktok: 2           # de 0 à 4

# Accroche affichée en GROS pendant les 3 premières secondes des Shorts (2 lignes, 18 caractères max, en anglais)
accroches_shorts:
  - ["Shhh...", "Mimo is sleeping"]
  - ["Play this for", "your baby"]
  - ["Bedtime with", "Mimo"]
  - ["Close your eyes,", "little one"]
  - ["Can you hear", "the lullaby?"]

# Phrases affichées ensuite en haut des Shorts (2 lignes, en anglais). Le système en choisit une au hasard.
textes_shorts:
  - ["Sleep tight,", "little one"]
  - ["Time to sleep,", "little star"]
  - ["Sweet dreams,", "little bear"]

# ---------- Ce que l'équipe a le droit d'utiliser ----------
# Décors autorisés (enlève ceux que tu ne veux plus voir)
decors_autorises: [lune, nuages, ocean, neige, lucioles, pluie]

# Instruments autorisés : boite_a_musique, piano, harpe, clochettes
instruments_autorises: [boite_a_musique, piano, harpe, clochettes]

# Comptines traditionnelles autorisées dans la vidéo longue
# Choix : twinkle, frere_jacques, row_your_boat, brahms, mary_lamb, london_bridge
comptines_autorisees: [twinkle, frere_jacques, row_your_boat, brahms, mary_lamb, london_bridge]

# Part de berceuses originales dans la vidéo longue (0 = que des comptines, 100 = que des originales)
pourcentage_originales: 35

# Tags ajoutés en plus sur toutes les vidéos
tags_en_plus: []
