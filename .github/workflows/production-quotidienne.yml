name: Sleepy Mimo - production quotidienne

on:
  schedule:
    - cron: "23 23 * * *"   # tous les jours vers 0h23 à Paris (hors de l'heure pile, moins de retard)
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main
    inputs:
      episode:
        description: "Numéro d'épisode à (re)faire (vide = épisode suivant)"
        required: false
        default: ""
      shorts:
        description: "Nombre de Shorts (vide = comme dans consignes.yml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg libcairo2 libass9 espeak-ng mbrola mbrola-us1 mbrola-us3 fluidsynth fluid-soundfont-gm
          mkdir -p ~/.fonts && cp fonts/Fredoka.ttf ~/.fonts/ && fc-cache -f
          pip install -q -r requirements.txt

      - name: Garder le modèle de voix en mémoire
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Télécharger le modèle de voix naturelles (une seule fois)
        run: |
          mkdir -p models
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s models/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro-v1.0.int8.onnx $B/kokoro-v1.0.int8.onnx
          [ -s models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $B/voices-v1.0.bin

      - name: L'équipe produit la journée
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EPISODE_OVERRIDE: ${{ github.event.inputs.episode }}
          SHORTS_OVERRIDE: ${{ github.event.inputs.shorts }}
        run: python main.py

      - name: Garder les vidéos en téléchargement (7 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-du-jour
          path: output/
          retention-days: 7

      - name: Sauvegarder la mémoire et le rapport
        if: always()
        run: |
          git config user.name "Sleepy Mimo Bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json reports/ || true
          git commit -m "Rapport du $(date -u +%F)" || echo "Rien à enregistrer"
          git push || echo "Push impossible"
