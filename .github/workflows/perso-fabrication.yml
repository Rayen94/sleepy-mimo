name: Perso - fabrication Rayen & Yakin

on:
  push:
    branches: [perso-rayen-yakin]
    paths: ["perso/LANCER.txt"]

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      eps: ${{ steps.e.outputs.eps }}
      shards: ${{ steps.e.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: e
        run: |
          EPS=$(tr -s ' \n' ' ' < perso/LANCER.txt | xargs | jq -R -c 'split(" ")|map(tonumber)')
          echo "eps=$EPS" >> $GITHUB_OUTPUT
          echo "shards=$(echo $EPS | jq -c '[.[] as $e | range(0;16) | {ep:$e, k:.}]')" >> $GITHUB_OUTPUT

  voix:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/cached_path
            ~/.cache/pip
          key: habibi-unified-v2
      - name: Outils
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
          pip install -q habibi-tts "torch==2.8.0" "torchaudio==2.8.0" faster-whisper praat-parselmouth soundfile \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: Voix ${{ matrix.ep }}-${{ matrix.k }}
        env:
          NFE: ${{ matrix.ep == 4 && '32' || '16' }}
          ATTEMPTS: "4"
          GOOD: "0.35"
        run: python perso/voix_shard.py ${{ matrix.ep }} ${{ matrix.k }} 16
      - uses: actions/upload-artifact@v4
        with:
          name: voix-ep${{ matrix.ep }}-${{ matrix.k }}
          path: voix_ep${{ matrix.ep }}/*.wav
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-ep${{ matrix.ep }}-${{ matrix.k }}
          path: voix_ep${{ matrix.ep }}/rapport_*.json
          retention-days: 3

  episode:
    needs: [setup, voix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        ep: ${{ fromJSON(needs.setup.outputs.eps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Outils
        timeout-minutes: 20
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Acquire::Retries=5 ffmpeg libcairo2 libass9 fluidsynth
          mkdir -p ~/.fonts && cp perso/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
          pip install -q numpy soundfile praat-parselmouth cairosvg==2.7.1 mido==1.3.3 scipy google-api-python-client==2.149.0 google-auth==2.35.0
      - uses: actions/cache@v4
        with:
          path: sf2
          key: soundfont-fluidr3-v1
      - name: Banque de sons
        timeout-minutes: 15
        continue-on-error: true
        run: |
          if [ ! -f sf2/FluidR3_GM.sf2 ]; then
            mkdir -p sf2 /tmp/sfd && cd /tmp/sfd && apt-get download fluid-soundfont-gm && dpkg-deb -x fluid-soundfont-gm*.deb x && cp x/usr/share/sounds/sf2/FluidR3_GM.sf2 $GITHUB_WORKSPACE/sf2/
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: voix-ep${{ matrix.ep }}-*
          path: voix_dl
      - name: Rassembler les voix
        run: |
          mkdir -p voix_ep${{ matrix.ep }}
          find voix_dl -name "*.wav" ! -name "_tmp*" -exec cp {} voix_ep${{ matrix.ep }}/ \;
          ls voix_ep${{ matrix.ep }} | wc -l
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rapport-ep${{ matrix.ep }}-*
          path: rapports_ep${{ matrix.ep }}
          merge-multiple: true
      - name: Dernière version du montage
        run: git fetch -q origin perso-rayen-yakin && git checkout origin/perso-rayen-yakin -- perso/film.py perso/humains.py perso/decors_tn.py perso/musique_tn.py perso/fabriquer.py perso/voix.py || true
      - name: Fabriquer l'épisode ${{ matrix.ep }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python perso/fabriquer.py ${{ matrix.ep }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rayen-yakin-episode-${{ matrix.ep }}
          path: perso_out/*.mp4
          retention-days: 7
      - name: Renvoyer le journal
        if: always()
        run: |
          mkdir -p perso/resultats
          cp perso_out/journal_ep*.txt perso_out/youtube_ep*.json perso/resultats/ 2>/dev/null || true
          python3 -c "import json,glob; r=[x for f in sorted(glob.glob('rapports_ep${{ matrix.ep }}/*.json')) for x in json.load(open(f))]; json.dump(r, open('perso/resultats/rapport_voix_ep${{ matrix.ep }}.json','w'), ensure_ascii=False, indent=0)" || true
          git config user.name "agent-perso"
          git config user.email "agent-perso@users.noreply.github.com"
          git add perso/resultats
          git commit -m "Résultats épisode ${{ matrix.ep }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin perso-rayen-yakin && git push -q origin HEAD:perso-rayen-yakin && break; sleep $((RANDOM % 10 + 3)); done
